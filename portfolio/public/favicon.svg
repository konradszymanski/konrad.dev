<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="surface" x1=".12" y1="0" x2=".88" y2="1">
      <stop offset="0" stop-color="#343a40"/>
      <stop offset=".48" stop-color="#171b20"/>
      <stop offset="1" stop-color="#090c10"/>
    </linearGradient>
    <linearGradient id="tile" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#353a40"/>
      <stop offset=".52" stop-color="#1a1e23"/>
      <stop offset="1" stop-color="#101419"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2=".15" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".72" stop-color="#e9edf0"/>
      <stop offset="1" stop-color="#cbd1d6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope=".72"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bevel" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="3" specularConstant=".75" specularExponent="18" lighting-color="#fff" result="spec">
        <fePointLight x="30" y="4" z="90"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="lit"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="lit"/></feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#surface)"/>
  <rect x="10" y="10" width="108" height="108" rx="25" fill="url(#tile)" stroke="#080a0d" stroke-width="2" filter="url(#shadow)"/>
  <rect x="12" y="12" width="104" height="104" rx="23" fill="none" stroke="#ffffff" stroke-opacity=".11" stroke-width="1.5"/>
  <path d="M35 29h19v31l29-31h24L73 63l35 37H83L54 69v31H35z" fill="#05070a" stroke="#07090b" stroke-width="5" stroke-linejoin="round" transform="translate(0 2)"/>
  <path d="M35 27h19v31l29-31h24L73 61l35 37H83L54 67v31H35z" fill="url(#letter)" stroke="#aeb5bb" stroke-width="1.5" stroke-linejoin="round" filter="url(#bevel)"/>
</svg>